# Every PR: Conventional Commits, tests with the Aedis Platform coverage gate (95 % lines, 85 % branches, no
# regression), typecheck, static build, and a DAST baseline against the built site served by the Cloudflare runtime
# (wrangler dev, workerd) with its real _headers. The gates, rules and summaries come from aedis-platform; this repository carries no glue of its own.
# Actions pinned by SHA; minimal permissions; no long-lived credentials.
name: CI

on:
  push:
    branches: [ main ]
  # Every PR, including stacked ones that target a feature branch.
  pull_request:

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request'
    uses: aedis-build/aedis-platform/.github/workflows/conventional-commits.yml@33c000e3effbd9151212c77aa29c24646ec6e5dc # v1
    permissions:
      contents: read

  coverage:
    uses: aedis-build/aedis-platform/.github/workflows/coverage-js.yml@820bfc78a548c3fcc98a5b9e303c93fa3a368243
    permissions:
      contents: read
      actions: read
    with:
      script: test:coverage
      reports: coverage/cobertura-coverage.xml
      min-line: 95
      min-branch: 85
      no-regression: true
      platform-ref: 820bfc78a548c3fcc98a5b9e303c93fa3a368243

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # DAST baseline (OWASP ZAP) against the site as Cloudflare serves it, so the scan sees the CSP, HSTS and the
      # rest of the headers the site really sends. Medium alerts fail too: a marketing page has no excuse for them.
      - run: pnpm start &
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:8080/; do sleep 1; done'
      - uses: aedis-build/aedis-platform/.github/actions/dast@820bfc78a548c3fcc98a5b9e303c93fa3a368243
        with:
          target-url: http://localhost:8080/
          fail-on: Medium

  reuse:
    name: REUSE (license and copyright on every file)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==5.0.2 lint
