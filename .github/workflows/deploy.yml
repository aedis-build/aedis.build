# Deploy to Cloudflare (static assets, no Worker code) on every push to main, which the ruleset only allows through a
# reviewed PR with CI green. The site is built here, packed and attested (SLSA provenance, Sigstore) before upload, so
# anyone can check which commit is live: `gh attestation verify aedis.build-site.tgz -R aedis-build/aedis.build`.
# The Cloudflare token lives only in the `production` environment (main only, required reviewer) and can do nothing
# but edit this account's Workers scripts and the aedis.build Workers routes. Cloudflare does not accept GitHub OIDC,
# so the token also expires and is rotated (see README).
name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, attest and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aedis.build
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        run: tar -czf aedis.build-site.tgz -C out .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: aedis.build-site.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aedis.build-site
          path: aedis.build-site.tgz
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
