# Deploy to Cloudflare on every push to main (the ruleset only lets changes reach main through a reviewed pull
# request with CI green). Build, SBOM, SLSA Build L3 attestation, verification and upload come from the deploy-static
# reusable workflow of Aedis Platform. The Cloudflare token lives only in the prd environment (main only, required
# reviewer, no admin bypass). To check what is live:
#   gh attestation verify aedis.build-site.tgz -R aedis-build/aedis.build --signer-workflow aedis-build/aedis-platform/.github/workflows/deploy-static.yml
name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    uses: aedis-build/aedis-platform/.github/workflows/deploy-static.yml@8afb428ee5cea69821a271c30a83ca0f2adab3c5 # feat/deploy-static (aedis-platform#49)
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: aedis.build-site
      url: https://aedis.build
