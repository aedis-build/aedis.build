# Deploy to Cloudflare (static assets, no Worker code) on every push to main, which the ruleset only allows through a
# reviewed PR with CI green. The site is built once, packed, described by an SBOM and attested twice: GitHub build
# provenance, and SLSA Build Level 3 provenance from the isolated slsa-github-generator reusable workflow. The deploy
# job verifies the attestation and uploads exactly those bytes, so anyone can check which commit is live:
#   gh attestation verify aedis.build-site.tgz -R aedis-build/aedis.build
#   slsa-verifier verify-artifact aedis.build-site.tgz --provenance-path aedis.build-site.intoto.jsonl --source-uri github.com/aedis-build/aedis.build
# The Cloudflare token lives only in the `prd` environment (main only, required reviewer) and can do nothing
# but deploy existing Workers (Workers Editor) and edit the aedis.build Workers routes. Cloudflare does not accept GitHub OIDC,
# so the token also expires and is rotated.
name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build, SBOM and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        run: tar -czf aedis.build-site.tgz -C out .
      - name: SBOM (syft, SPDX) of the dependencies that built the site
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: aedis.build-site.sbom.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: aedis.build-site.tgz
      - id: hash
        name: Subjects for the SLSA generator
        run: echo "subjects=$(sha256sum aedis.build-site.tgz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aedis.build-site
          path: |
            aedis.build-site.tgz
            aedis.build-site.sbom.spdx.json

  provenance:
    name: SLSA Build L3 provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    # The SLSA generator must be referenced by tag: it verifies its own ref when it runs.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.subjects }}
      provenance-name: aedis.build-site.intoto.jsonl
      upload-assets: false

  deploy:
    name: Verify and deploy
    needs: [ build, provenance ]
    runs-on: ubuntu-latest
    environment:
      name: prd
      url: https://aedis.build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Only for wrangler (pinned by the lockfile); the site itself comes from the attested archive.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aedis.build-site
      - name: Verify the attestation and unpack exactly those bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh attestation verify aedis.build-site.tgz -R "$REPO"
          rm -rf out && mkdir out && tar -xzf aedis.build-site.tgz -C out
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
