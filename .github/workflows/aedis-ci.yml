# Single quality pipeline of the site: calls aedis-ci from Aedis Platform (Conventional Commits, tests with the
# 95/85 coverage gate and no regression, typecheck and static build, SAST with the Aedis and Next.js rules, CodeQL
# security-extended, REUSE, and DAST against the site served by the Cloudflare runtime, failing on Medium).
# The pipeline belongs to the platform; this file only holds the trigger, the permissions and the site's parameters.
# On pull requests it runs for any base, so stacked pull requests are validated too.
name: aedis-ci

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "29 5 * * 2"

# One run per pull request: a new push or closing the PR cancels the run in progress. Pushes to main and the
# schedule never share a group (run_id), so those runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  aedis:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/aedis-ci.yml@65aaf48027fac46d8ab6298e5cbdb63df119f1de # main (aedis-platform#49)
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
      id-token: write
    with:
      language: node
      min-line: 95
      min-branch: 85
      no-regression: true
      check-scripts: typecheck build
      codeql-queries: security-extended
      sast-extra-configs: p/nextjs
      dast-start: "pnpm build && (WRANGLER_SEND_METRICS=false pnpm start > site.log 2>&1 &)"
      dast-fail-on: Medium
      platform-ref: 65aaf48027fac46d8ab6298e5cbdb63df119f1de
