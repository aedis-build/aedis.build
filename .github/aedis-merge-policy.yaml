# Merge gate policy (aedis-build/aedis-platform merge-gate.yml). Always read from the default branch; anything not
# listed here needs a human.
schema: aedis.platform/merge-policy/v1
trustedAuthors: [jeffersonnlucas]
humanRequiredPaths:
  - ".github/**"
  - CODEOWNERS
  - SECURITY.md
  - LICENSE
  - "LICENSES/**"
  - REUSE.toml
  # The response headers and the hosting of the whole site.
  - scripts/headers.ts
  - wrangler.jsonc
  # Copies of aedis-ui registry items: they change only through the registry, never by hand.
  - "components/ui/**"
  - "lib/**"
  - "styles/**"
requiredSummaries: [coverage-summary, sast-summary]
coverageNoRegression: true
maxChangedLines: 2000
allowBreaking: false
mergeMethod: squash
